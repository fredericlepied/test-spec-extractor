# This file is managed by 'fullsend repos': repos-config-v1
# Do not edit this file directly; changes will be overwritten.
# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
tracker:
    jira:
      base_url: https://redhat.atlassian.net
      project: CILAB
      poll:
        enabled: true
        query: 'labels = "fullsend" ORDER BY updated DESC'
runtime: codex
roles:
    - triage
    - coder
    - review
    - fix
agents:
    - name: triage
      runtime: codex
      model: openai/gpt-6.2-sol
      effort: low
    - name: code
      runtime: codex
      model: openai/gpt-6.2-sol
      effort: low
    - name: review
      runtime: codex
      model: openai/gpt-6.2-sol
      effort: low
    - name: fix
      runtime: codex
      model: openai/gpt-6.2-sol
      effort: low
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/

# Limit published run data, including GitHub follow-up runs.
# These settings do not redact PRs, comments, commits, or all script output.
artifacts:
    content: none
progress:
    verbosity: quiet
